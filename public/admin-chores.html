<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="page-version" content="1792130404">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chores - Yada Yah</title>
    <script>
    // Chores has no page of its own: each tab is the real admin page opened
    // with ?chores=<tab> (js/admin-chores.js draws the Chores title + tabs).
    // Open the #tab asked for, else the last one used, else MP3s.
    (function () {
        var CHORES = {
            mp3:         '/admin-feeds?chores=mp3',
            transcripts: '/admin-feeds?chores=transcripts',
            ask:         '/admin-ask?chores=ask',
            edit:        '/admin-books?chores=edit#edit',
            words:       '/admin-glossary?chores=words'
        };
        var name = location.hash.replace('#', '');
        if (!CHORES[name]) { try { name = localStorage.getItem('admin-chores:tab') || ''; } catch (e) { name = ''; } }
        location.replace(CHORES[name] || CHORES.mp3);
    })();
    </script>
</head>

</html>
