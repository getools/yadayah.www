<body>

<div id="login-screen" class="login-screen">
    <div class="login-card">
        <h1>Admin</h1>
        <div class="field">
            <label for="login-user">Login</label>
            <input type="text" id="login-user" autocomplete="username">
        </div>
        <div class="field">
            <label for="login-pass">Password</label>
            <div class="pass-wrap">
                <input type="password" id="login-pass" autocomplete="current-password">
                <button type="button" class="pass-toggle" onclick="togglePassword()" title="Show/hide password">&#128065;</button>
            </div>
        </div>
        <div id="login-error" class="error-messages" style="display:none"></div>
        <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Login</button>
    </div>
</div>

<div id="app" class="container" style="display:none">
    <div class="app-header">
        <nav class="nav-tabs"></nav>
<script src="/js/admin-nav.js?v=31"></script>
        <div class="user-info">
            <span id="user-display"></span>
            <button class="btn btn-secondary btn-sm" onclick="doLogout()">Logout</button>
        </div>
    </div>
    <div id="admin-sections" class="admin-sections"></div>
</div>

<style>
.admin-sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.admin-section {
    display: flex; gap: 14px; align-items: flex-start;
    background: #fff; border: 1px solid #e3e6ea; border-radius: 8px;
    padding: 16px; color: inherit; text-decoration: none;
    transition: border-color .15s, box-shadow .15s, transform .15s;
}
.admin-section:hover { border-color: #3498db; box-shadow: 0 4px 14px rgba(52,152,219,.15); transform: translateY(-1px); }
.admin-section:focus-visible { outline: 2px solid #3498db; outline-offset: 2px; }
.admin-section-icon {
    flex: none; width: 40px; height: 40px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: #eaf4fc; color: #3498db;
}
.admin-section-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.admin-section-body { min-width: 0; }
.admin-section h3 { margin: 0 0 4px; font-size: 1.05rem; color: #2c3e50; }
.admin-section p { margin: 0; font-size: .875rem; line-height: 1.45; color: #5d6d7e; }
.admin-section-tabs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.admin-section-tabs span { font-size: .72rem; padding: 2px 7px; border-radius: 10px; background: #f0f2f5; color: #566573; }
@media (max-width: 600px) { .admin-sections { grid-template-columns: 1fr; } }
</style>

<script>
var API = '/api';

function checkAuth() {
    fetch(API + '/auth.php', {credentials:'include'}).then(r=>r.json()).then(function(d) {
        if (d.authenticated) {
            document.getElementById('app').style.display = '';
            document.getElementById('user-display').textContent = d.user_name;
        } else {
            document.getElementById('login-screen').classList.add('visible');
        }
    });
}

function doLogin() {
    var user = document.getElementById('login-user').value;
    var pass = document.getElementById('login-pass').value;
    var errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    fetch(API + '/auth.php', {
        method: 'POST', credentials: 'include',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({login: user, password: pass})
    }).then(r=>r.json()).then(function(d) {
        if (d.authenticated) {
            document.getElementById('login-screen').classList.remove('visible');
            document.getElementById('app').style.display = '';
            document.getElementById('user-display').textContent = d.user_name;
        } else {
            errEl.textContent = d.error || 'Login failed';
            errEl.style.display = '';
        }
    });
}

function doLogout() {
    fetch(API + '/auth.php', {method:'DELETE', credentials:'include'}).then(function() {
        location.reload();
    });
}

function togglePassword() {
    var input = document.getElementById('login-pass');
    input.type = input.type === 'password' ? 'text' : 'password';
}

document.getElementById('login-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
});

function renderAdminSections() {
    var host = document.getElementById('admin-sections');
    var tabs = window.ADMIN_NAV_TABS || [];
    if (!host || !tabs.length) return;
    function esc(s) {
        return String(s).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
    }
    host.innerHTML = tabs.map(function(t) {
        var key = t[0].replace(/\.html$/, '');
        var info = SECTION_INFO[key] || {};
        var icon = info.icon || '<rect x="3" y="3" width="18" height="18" rx="2"/>';
        var desc = info.desc || t[2] || '';
        var sub = (info.tabs || []).map(function(s) { return '<span>' + esc(s) + '</span>'; }).join('');
        return '<a class="admin-section" href="' + esc(t[0]) + '">' +
            '<div class="admin-section-icon"><svg viewBox="0 0 24 24" aria-hidden="true">' + icon + '</svg></div>' +
            '<div class="admin-section-body"><h3>' + esc(t[1]) + '</h3>' +
            (desc ? '<p>' + esc(desc) + '</p>' : '') +
            (sub ? '<div class="admin-section-tabs">' + sub + '</div>' : '') +
            '</div></a>';
    }).join('');
}
